<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Viewer - 複数の半透明モデル</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    
    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0;
        }
        model-viewer {
            width: 800px; /* ビューアの幅 */
            height: 600px; /* ビューアの高さ */
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        /* モデルを重ねるためのスタイル */
        .model-container {
            position: relative;
            width: 800px; /* model-viewerと同じ幅に合わせる */
            height: 600px; /* model-viewerと同じ高さに合わせる */
        }
        .model-container model-viewer {
            position: absolute;
            top: 0;
            left: 0;
            /* 常に最前面で描画されるようにする */
            /* iOSではalpha-blendが正常に動作しない場合があるため、明示的に指定 */
            /* web-component-renderer="legacy-renderer" を追加すると透明度が効く場合があります */
            /* または、アルファチャンネルを持つテクスチャをモデルに適用する */
        }
    </style>
</head>
<body>

    <div class="model-container">
        <model-viewer
            id="model1"
            src="sphere-1-1.gltf" alt="モデル1"
            ar
            shadow-intensity="1"
            camera-controls
            rotation-per-second="10deg"
            auto-rotate
            environment-image="neutral"
            exposure="1"
            camera-orbit="0deg 75deg 1.5m"
            poster="https://modelviewer.dev/assets/poster-astronaut.png"
            loading="eager"
            web-component-renderer="legacy-renderer" /* 透明度を有効にするための設定 */
            scale="0.5"
        >
        </model-viewer>

        <model-viewer
            id="model2"
            src="isocahedron-1-1.gltf" alt="モデル2"
                        ar
            shadow-intensity="1"
            camera-controls
            rotation-per-second="10deg"
            auto-rotate
            environment-image="neutral"
            exposure="1"
            camera-orbit="0deg 75deg 1.5m"
            poster="https://modelviewer.dev/assets/poster-astronaut.png"
            loading="eager"
            web-component-renderer="legacy-renderer" /* 透明度を有効にするための設定 */
        >
        </model-viewer>
    </div>

    <script>
        // モデルがロードされた後に透明度を設定する
        const modelViewer1 = document.querySelector("#model1");
        const modelViewer2 = document.querySelector("#model2");

        // モデル1のロード完了時
        modelViewer1.addEventListener('load', () => {
            // マテリアルを取得し、透明度を設定
            // これはモデルのマテリアル設定に依存するため、注意が必要です。
            // 多くのモデルはデフォルトで不透明なマテリアルを持っています。
            // 最も確実なのは、glTF/GLBファイルを生成する際にマテリアルにアルファチャンネルを設定することです。
            // ここでは一例として、もしマテリアルが存在すれば透明度を設定します。
            const material1 = modelViewer1.model.materials[0]; // 最初のマテリアルを取得
            if (material1) {
                // アルファモードを'BLEND'に設定（透明度を有効にする）
                material1.setAlphaMode('BLEND'); 
                // ベースカラーのアルファ値を設定（透明度）
                // glTFのマテリアルはベースカラーのアルファチャンネルを使うのが一般的
                // ここでは、JavaScriptで動的にアルファ値を変更する例
                const baseColorFactor1 = material1.pbrMetallicRoughness.baseColorFactor;
                baseColorFactor1[3] = 0.5; // アルファ値を0.5 (50%透明)に設定
                material1.pbrMetallicRoughness.setBaseColorFactor(baseColorFactor1);
            }
        });

        // モデル2のロード完了時
        modelViewer2.addEventListener('load', () => {
            const material2 = modelViewer2.model.materials[0]; // 最初のマテリアルを取得
            if (material2) {
                material2.setAlphaMode('BLEND');
                const baseColorFactor2 = material2.pbrMetallicRoughness.baseColorFactor;
                baseColorFactor2[0] = 0; // 赤を0に
                baseColorFactor2[1] = 0; // 緑を0に
                baseColorFactor2[2] = 1; // 青を1に（青色にする）
                baseColorFactor2[3] = 0.7; // アルファ値を0.7 (30%透明)に設定
                material2.pbrMetallicRoughness.setBaseColorFactor(baseColorFactor2);
            }
        });

        // モデルの初期位置を調整（重ね合わせるために）
        // `camera-orbit`属性はカメラの位置を制御し、モデル自体の位置は`translate`で調整します。
        // ここでは、両方のモデルが同じカメラ位置で表示されるように`camera-orbit`を揃えています。
        // モデル自体の相対的な位置を調整したい場合は、blenderなどの3Dソフトでモデルを編集するか、
        // `model-viewer`の代わりにThree.jsなどを使ってより低レベルでモデルを操作する必要があります。
    </script>
</body>
</html>
